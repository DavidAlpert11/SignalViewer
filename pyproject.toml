# Tooling only. The PyPI package's metadata is written by tools/make_pypi.py (T56), from
# requirements.txt and backend/app/version.py - change it there.
[tool.pytest.ini_options]
# `pytest` from the repo root runs the fast backend tests; the browser tests are run on
# purpose: `pytest tests/e2e` (one file at a time until F02 is fixed).
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.mypy]
# T36: the backend is type-checked (cd backend && mypy --config-file ../pyproject.toml app svcore signalviewer).
ignore_missing_imports = true      # numpy / scipy / pymavlink / pyulog... ship no or partial types
# No per-module baseline any more (T36b, 2026-10-18): every module is clean, so any new finding
# fails the check. Narrow Optionals where they are known to be set (an `is None` branch, or an
# assert for an invariant) rather than silencing a module.
