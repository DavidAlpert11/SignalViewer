# Tooling only for now (no package metadata yet - that comes with the command line, T11).
[tool.pytest.ini_options]
# `pytest` from the repo root runs the fast backend tests; the browser tests are run on
# purpose: `pytest tests/e2e` (one file at a time until F02 is fixed).
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.mypy]
# T36: the backend is type-checked (cd backend && mypy --config-file ../pyproject.toml app svcore signalviewer).
ignore_missing_imports = true      # numpy / scipy / pymavlink / pyulog... ship no or partial types

# Baseline (2026-10-18): these modules still have findings of these kinds only - Optional values
# (mostly Signal.time) narrowed where mypy cannot follow. A new KIND of finding in them, or any
# finding in another module, fails the check. Shrinking this list is task T36b.
[[tool.mypy.overrides]]
module = "app.common"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "app.prefs"
disable_error_code = ["operator", "union-attr"]

[[tool.mypy.overrides]]
module = "app.routes.analysis"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "app.routes.files"
disable_error_code = ["operator"]

[[tool.mypy.overrides]]
module = "app.store"
disable_error_code = ["return-value", "union-attr"]

[[tool.mypy.overrides]]
module = "svcore.analysis"
disable_error_code = ["arg-type", "assignment", "return-value"]

[[tool.mypy.overrides]]
module = "svcore.bin_loader"
disable_error_code = ["arg-type", "assignment", "index", "misc"]

[[tool.mypy.overrides]]
module = "svcore.csv_loader"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "svcore.limits"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "svcore.templates"
disable_error_code = ["arg-type", "list-item"]

[[tool.mypy.overrides]]
module = "svcore.tlog_loader"
disable_error_code = ["misc", "operator"]

[[tool.mypy.overrides]]
module = "svcore.ulog_loader"
disable_error_code = ["arg-type", "index"]
