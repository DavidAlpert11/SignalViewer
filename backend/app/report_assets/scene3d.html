    const o = ob.o, k = idxAt(o, Number(slider.value)), roll = o.roll[k] ?? 0, pitch = o.pitch[k] ?? 0, cx = 59, cy = 59, R0 = 54;
    ac.save(); ac.beginPath(); ac.arc(cx, cy, R0, 0, 2 * Math.PI); ac.clip();
    ac.translate(cx, cy); ac.rotate(-roll * R); ac.translate(0, pitch * 1.6);
    ac.fillStyle = "#3a7bc8"; ac.fillRect(-120, -240, 240, 240);
    ac.fillStyle = "#8a5a2b"; ac.fillRect(-120, 0, 240, 240);
    ac.strokeStyle = "#fff"; ac.lineWidth = 1.5; ac.beginPath(); ac.moveTo(-120, 0); ac.lineTo(120, 0); ac.stroke();
    ac.lineWidth = 1; ac.font = "9px system-ui"; ac.fillStyle = "#fff"; ac.textAlign = "left";
    for (const p of [-20, -10, 10, 20]) { const y = -p * 1.6, w = p % 20 ? 10 : 18; ac.beginPath(); ac.moveTo(-w, y); ac.lineTo(w, y); ac.stroke(); ac.fillText(String(Math.abs(p)), w + 3, y + 3); }
    ac.restore();
    ac.strokeStyle = "#f2a93b"; ac.lineWidth = 3; ac.beginPath(); ac.moveTo(cx - 30, cy); ac.lineTo(cx - 10, cy); ac.lineTo(cx, cy + 7); ac.lineTo(cx + 10, cy); ac.lineTo(cx + 30, cy); ac.stroke();
    ac.lineWidth = 1.5; ac.strokeStyle = "rgba(255,255,255,.7)"; ac.beginPath(); ac.arc(cx, cy, R0, 0, 2 * Math.PI); ac.stroke();
    const hdg = ((o.yaw[k] ?? 0) % 360 + 360) % 360;
    ac.font = "600 12px system-ui"; ac.textAlign = "center"; ac.fillStyle = "#fff"; ac.strokeStyle = "#0b1118"; ac.lineWidth = 3;
    const txt = `${o.name} · ${hdg.toFixed(0)}°`; ac.strokeText(txt, cx, H - 4); ac.fillText(txt, cx, H - 4);
  }
  need = () => { if (!dirty) { dirty = true; requestAnimationFrame(frame); } };
  draw = need;
  state = () => ({ t: Number(slider.value), gl: true, trail: trail.sec, cam: cam.st.mode, camDist: sph.r, objects: objs.map((ob) => ({ name: ob.o.name, x: ob.at.x, up: ob.at.y / ex, north: -ob.at.z, t: ob.at.t })) });
  $("ex").addEventListener("change", () => { ex = Number($("ex").value) || 1; setGround(); setTracks(); need(); });
  $("fit").onclick = () => { cam.free(); fit(); };
  $("top").onclick = () => { sph.ph = 0.03; sph.th = 0; need(); };
  addEventListener("resize", need);
  fit(); update();
  if (cam.st.mode !== "free") sph.r = 1500;
  if (cam.st.mode === "close") { sph.r = 70; sph.ph = 1.32; }      // opened from a link on Chase
  need();
})();
$("theme").onclick = () => { dark = !dark; document.documentElement.classList.toggle("dark", dark); draw(); };
slider.addEventListener("input", () => draw());
document.documentElement.classList.toggle("dark", dark);
// a replay page or a live report (the HTML report with one time) drives the time from outside - the same
// message as the 2D map's page; its own time row is hidden there (one time control per page)
addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.sv !== "replay") return;
  if (m.hideTime) { $("time").hidden = true; $("title").style.visibility = "hidden"; }
  if (typeof m.dark === "boolean") { dark = m.dark; document.documentElement.classList.toggle("dark", dark); }
  if (typeof m.t === "number" && isFinite(m.t)) slider.value = Math.min(t1, Math.max(t0, m.t));
  draw();
});
draw();
</script>
