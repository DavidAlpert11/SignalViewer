      mc.fillStyle = ob.o.color; mc.strokeStyle = "#fff"; mc.lineWidth = 1.5; mc.beginPath(); mc.arc(x, y, 4, 0, 2 * Math.PI); mc.fill(); mc.stroke();
      mc.beginPath(); mc.moveTo(x, y); mc.lineTo(x + Math.sin(h) * 11, y - Math.cos(h) * 11); mc.stroke(); }
  }
  miniCv.addEventListener("click", (e) => {
    const b = miniCv.getBoundingClientRect(), W = b.width, x = e.clientX - b.left, y = e.clientY - b.top;
    const E = miniBox.ce + (x - W / 2) / W * miniBox.span, N = miniBox.cn - (y - W / 2) / W * miniBox.span;
    cam.free();
    glideTo({ x: E, y: target.y, z: -N, r: Math.max(400, sph.r), ph: 0.9 });
  });
  need = () => { if (!dirty) { dirty = true; requestAnimationFrame(frame); } };
  draw = need;
  state = () => ({ camObj: objs[cam.st.obj] ? objs[cam.st.obj].o.name : null, wow: { sun: D.sun || null, drop: objs.some((ob) => ob.drop.visible), recent: objs.some((ob) => ob.recentMesh.visible), gliding: !!glide,
      cockpit: cam.st.mode === "cockpit", fov: camera.fov, display: dispOn && !$("adi").hidden, mini: !miniCv.hidden, errorSurface: errInfo ? { shown: !!(errMesh && errMesh.visible), p95: errInfo.p95, median: errInfo.median } : null },
    grounds: grounds.length, fog: !!scene.fog, t: Number(slider.value), gl: true, trail: trail.sec, cam: cam.st.mode, camDist: sph.r, objects: objs.map((ob) => ({ name: ob.o.name, x: ob.at.x, up: ob.at.y / ex, north: -ob.at.z, t: ob.at.t })) });
  $("ex").addEventListener("change", () => { ex = Number($("ex").value) || 1; setGround(); setFar(); setTracks(); need(); });
  $("fit").onclick = () => { cam.free(); fit(); };
  $("top").onclick = () => glideTo({ ph: 0.03, th: 0 });
  if (D.camera === "top") $("top").onclick();             // P4: the Map's camera in the app was From above
  addEventListener("resize", need);
  fit(); update();
  if (cam.st.mode !== "free") sph.r = 1500;
  if (cam.st.mode === "close") { sph.r = 70; sph.ph = 1.32; }      // opened from a link on Chase
  showDisplay(cam.st.mode);
  window.__scene.glideTo = glideTo;                                // P10: the story flies the camera
  // P10: a Story moment flies to its object - On the object at ~400 m, or Chase when close; at the end the
  // reader's own camera comes back (unless they stayed on a moment)
  let saved = null;
  window.__scene.focus = (f, keep) => {
    if (f) {
      const i = objs.findIndex((ob) => ob.o.name === f.object);
      if (i < 0) return;
      if (!saved) saved = { mode: cam.st.mode, obj: cam.st.obj, r: sph.r, th: sph.th, ph: sph.ph, x: target.x, y: target.y, z: target.z };
      followOff.set(0, 0, 0);
      cam.to(f.close ? "close" : "centre", i); showDisplay(cam.st.mode);
      glideTo(f.close ? { r: 70, ph: 1.32, free: false } : { r: 400, ph: 1.0, free: false });
    } else if (saved) {
      const s0 = saved; saved = null;
      if (keep) return;
      cam.to(s0.mode, s0.obj); showDisplay(s0.mode);
      glideTo({ r: s0.r, th: s0.th, ph: s0.ph, x: s0.x, y: s0.y, z: s0.z, free: s0.mode === "free" });
    }
    need();
  };
  need();
})();
$("theme").onclick = () => { dark = !dark; document.documentElement.classList.toggle("dark", dark); draw(); };
slider.addEventListener("input", () => draw());
document.documentElement.classList.toggle("dark", dark);
// a replay page or a live report (the HTML report with one time) drives the time from outside - the same
// message as the 2D map's page; its own time row is hidden there (one time control per page)
addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.sv !== "replay") return;
  if (m.hideTime) { $("time").hidden = true; $("title").style.visibility = "hidden"; }
  if (typeof m.dark === "boolean") { dark = m.dark; document.documentElement.classList.toggle("dark", dark); }
  if (typeof m.t === "number" && isFinite(m.t)) slider.value = Math.min(t1, Math.max(t0, m.t));
  if (m.focus !== undefined && window.__scene.focus) window.__scene.focus(m.focus, m.keep);
  draw();
});
draw();
</script>
