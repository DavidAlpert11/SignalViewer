<!doctype html>
<html lang="__LANG__" dir="__DIR__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!--__NOTE__-->
<style>/*__PAGE_CSS__*/</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="seg" id="cam" role="radiogroup"><span id="camT"></span><button data-cam="free" role="radio"></button><button data-cam="centre" role="radio"></button><button data-cam="close" role="radio"></button></span>
  <label><span id="objT"></span><select id="obj"></select></label>
  <button id="zin">+</button><button id="zout">−</button><button id="fit">⤢</button>
  <label><span id="trailT"></span><select id="trail"></select></label>
  <button id="rel" aria-pressed="true"></button>
  <button id="theme">◐</button>
</header>
<div id="wrap"><canvas id="map"></canvas><div id="labels"></div><div id="legend"></div><div id="tip" role="tooltip"></div><div id="help"></div></div>
<div id="time"><span id="timeT">t</span><input id="slider" type="range" min="0" max="1" step="any"><span id="tval"></span></div>
<footer><span id="att"></span> · <span>__NOTE_TEXT__</span></footer>
<script>/*__RELATION__*/</script>
<script>
"use strict";
const D = /*__DATA__*/null;
const S = D.S, $ = (id) => document.getElementById(id);
const LAT_MAX = 85.05112878, TILE = 256, R_E = 6378137;
const mx = (lon) => (lon + 180) / 360;
const my = (lat) => { const s = Math.sin(Math.max(-LAT_MAX, Math.min(LAT_MAX, lat)) * Math.PI / 180); return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); };
const cv = $("map"), ctx = cv.getContext("2d"), tip = $("tip");
const slider = $("slider"), tval = $("tval");
$("title").textContent = D.title || "Map";
$("att").textContent = D.attribution;
let dark = D.dark || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
const imgs = { light: {}, dark: {} };
for (const th of ["light", "dark"]) for (const [k, src] of Object.entries(D.tiles[th])) { const im = new Image(); im.onload = draw; im.src = src; imgs[th][k] = im; }
// the tracks in Mercator units, and in local metres (for the relation box), once
const [s_, w_, n_, e_] = D.bounds, lat0 = (s_ + n_) / 2, lon0 = (w_ + e_) / 2, kE = Math.PI / 180 * R_E * Math.cos(lat0 * Math.PI / 180), kN = Math.PI / 180 * R_E;
const objs = D.objects.map((o) => ({ ...o, X: o.lon.map(mx), Y: o.lat.map(my), E: o.lon.map((v) => (v - lon0) * kE), N: o.lat.map((v) => (v - lat0) * kN), U: o.alt, yaw: null }));
const legend = $("legend");
for (const o of objs) { const d = document.createElement("div"); const i = document.createElement("i"); i.style.borderTopColor = o.color; if (o.track) i.className = o.track; d.append(i, document.createTextNode(o.name)); legend.append(d); }
let t0 = Infinity, t1 = -Infinity;
for (const o of objs) { if (o.t.length) { t0 = Math.min(t0, o.t[0]); t1 = Math.max(t1, o.t[o.t.length - 1]); } }
slider.min = t0; slider.max = t1; slider.value = D.cursor ?? t1;
{ const h = svHash.read(); if (h.t !== undefined && isFinite(+h.t)) slider.value = Math.min(t1, Math.max(t0, +h.t)); }   // a link to a moment
// the view: centre (Mercator) and zoom (a float: 2^z tiles across the world)
const view = { cx: 0.5, cy: 0.5, z: 2 };
function fit() {
  const [s, w, n, e] = D.bounds, W = cv.clientWidth || 800, H = cv.clientHeight || 500;
  const x0 = mx(w), x1 = mx(e), y0 = my(n), y1 = my(s);
  view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;
  view.z = Math.log2(Math.min(W / Math.max(x1 - x0, 1e-9), H / Math.max(y1 - y0, 1e-9)) / TILE);
}
const toPx = (X, Y) => { const s = TILE * 2 ** view.z; return [cv.width / 2 + (X - view.cx) * s * devicePixelRatio, cv.height / 2 + (Y - view.cy) * s * devicePixelRatio]; };
const idxAt = (o, t) => { let lo = 0, hi = o.t.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (o.t[m] <= t) lo = m; else hi = m - 1; } return lo; };
const lerpAt = (o, t) => { const k = idxAt(o, t), k2 = Math.min(o.t.length - 1, k + 1), f = o.t[k2] > o.t[k] ? Math.min(1, Math.max(0, (t - o.t[k]) / (o.t[k2] - o.t[k]))) : 0;
  return [o.X[k] + (o.X[k2] - o.X[k]) * f, o.Y[k] + (o.Y[k2] - o.Y[k]) * f]; };
// the relation box and the camera (the toolbar both pages share)
const rel = svRelation($("wrap"), objs, S, D.pair, () => draw(), (t) => svSeek(slider, t, draw));
const trail = svTrail(S, () => draw());
if (!rel.el) $("rel").hidden = true;
rel.onShow = (on) => { $("rel").setAttribute("aria-pressed", String(on)); };
$("rel").onclick = () => rel.show(!rel.shown());
const cam = svToolbar(S, objs, { mode: "free", obj: rel.pair.p }, (st, user) => {
  if (user && st.mode === "close") { const W = cv.clientWidth || 800, k = TILE * 2 ** 0; view.z = Math.log2(W / (900 / (40075016.686 * Math.cos(lat0 * Math.PI / 180))) / k); }
  draw();
});
function draw() {
  svHash.write(slider.value, cam.st);
  const W = cv.clientWidth, H = cv.clientHeight, r = devicePixelRatio || 1;
  if (cv.width !== Math.round(W * r) || cv.height !== Math.round(H * r)) { cv.width = Math.round(W * r); cv.height = Math.round(H * r); }
  const th = dark ? "dark" : "light";
  document.documentElement.classList.toggle("dark", dark);
  const t = Number(slider.value);
  if (cam.st.mode !== "free") { const [X, Y] = lerpAt(objs[cam.st.obj], t); view.cx = X; view.cy = Y; }
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--bg");
  ctx.fillRect(0, 0, cv.width, cv.height);
  // the embedded level nearest below the view's zoom (else the coarsest), its tiles scaled
  const lv = D.levels[th]; let L = lv[0];
  for (const z of lv) if (z <= Math.ceil(view.z)) L = z;
  if (L !== undefined) {
    const n = 2 ** L, s = TILE * 2 ** view.z * r / n;
    for (const [k, im] of Object.entries(imgs[th])) {
      const [z, x, y] = k.split("/").map(Number);
      if (z !== L || !im.complete) continue;
      const [px, py] = toPx(x / n, y / n);
      if (px > cv.width || py > cv.height || px + s < 0 || py + s < 0) continue;
      ctx.drawImage(im, px, py, s + 0.5, s + 0.5);
    }
  }
  tval.textContent = t.toFixed(2) + " s";
  // the tracks as the app draws them: a line, a navigation solution dashed, a receiver as points
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  for (const o of objs) {
    const k1 = idxAt(o, t), k0 = trail.sec ? idxAt(o, t - trail.sec) : 0, last = trail.sec ? k1 : o.t.length - 1;
    const dash = o.track === "dash" ? [9 * r, 6 * r] : o.track === "points" ? [0.1, 6 * r] : [];
    for (const [w, c] of [[(o.track === "points" ? 6 : 4.5) * r, dark ? "rgba(0,0,0,.55)" : "rgba(255,255,255,.7)"], [(o.track === "points" ? 4 : 2.5) * r, o.color]]) {
      ctx.setLineDash(dash); ctx.beginPath(); ctx.lineWidth = w; ctx.strokeStyle = c;
      for (let i = k0; i <= last; i++) { const [px, py] = toPx(o.X[i], o.Y[i]); if (i > k0) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  const pos = objs.map((o) => toPx(...lerpAt(o, t)));
  // the pair: a dashed line between them (its distance in the labels layer), the rings
  const showRel = rel.el && rel.shown();
  if (showRel) {
    const a = pos[rel.pair.p], b = pos[rel.pair.s];
    ctx.setLineDash([6 * r, 5 * r]); ctx.lineWidth = 1.6 * r; ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--amber");
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.setLineDash([]);
  }
  objs.forEach((o, i) => {
    const [px, py] = pos[i];
    ctx.beginPath(); ctx.arc(px, py, 6 * r, 0, 2 * Math.PI); ctx.fillStyle = o.color; ctx.fill();
    ctx.lineWidth = 2 * r; ctx.strokeStyle = dark ? "#151b23" : "#fff"; ctx.stroke();
  });
  // names, rings and the pair's distance: HTML on top (crisp text, the same look as the 3D view)
  const lab = $("labels"); lab.textContent = "";
  const put = (cls, x, y, text) => { const d = document.createElement("div"); d.className = cls; d.style.left = x / r + "px"; d.style.top = y / r + "px"; if (text) d.textContent = text; lab.append(d); };
  objs.forEach((o, i) => put("lab", pos[i][0], pos[i][1], o.name));
  if (showRel) {
    put("ring", pos[rel.pair.p][0], pos[rel.pair.p][1]); put("ring s", pos[rel.pair.s][0], pos[rel.pair.s][1]);
    rel.update(t);
    const v = rel.value, a = pos[rel.pair.p], b = pos[rel.pair.s];
    if (v) put("link", (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (v.slant ?? v.horiz) >= 1000 ? ((v.slant ?? v.horiz) / 1000).toFixed(2) + " km" : (v.slant ?? v.horiz).toFixed(0) + " m");
  }
  window.__markers = objs.map((o) => { const k = idxAt(o, t); return [o.lat[k], o.lon[k]]; });   // for tests
}
// pan, zoom, hover
let drag = null;
cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy }; cv.setPointerCapture(e.pointerId); cv.classList.add("drag"); });
cv.addEventListener("pointerup", () => { drag = null; cv.classList.remove("drag"); });
cv.addEventListener("pointermove", (e) => {
  const s = TILE * 2 ** view.z;
  if (drag) { cam.free(); view.cx = drag.cx - (e.clientX - drag.x) / s; view.cy = drag.cy - (e.clientY - drag.y) / s; draw(); return; }
  const b = cv.getBoundingClientRect(), r = devicePixelRatio || 1, mxp = (e.clientX - b.left) * r, myp = (e.clientY - b.top) * r;
  let best = null, dmin = 10 * r;
  for (const o of objs) o.X.forEach((X, i) => { const [px, py] = toPx(X, o.Y[i]); const d = Math.hypot(px - mxp, py - myp); if (d < dmin) { dmin = d; best = { o, i }; } });
  if (!best) { tip.style.display = "none"; return; }
  const { o, i } = best;
  tip.textContent = `${o.name} · t ${o.t[i].toFixed(2)} s · ${o.lat[i].toFixed(6)}, ${o.lon[i].toFixed(6)}` + (o.alt ? ` · ${o.alt[i].toFixed(1)} m` : "");
  tip.style.display = "block"; tip.style.left = (e.clientX - b.left + 12) + "px"; tip.style.top = (e.clientY - b.top + 12) + "px";
});
cv.addEventListener("pointerleave", () => { tip.style.display = "none"; });
function zoomAt(dz, px, py) {
  const s0 = TILE * 2 ** view.z, W = cv.clientWidth, H = cv.clientHeight;
  const X = view.cx + (px - W / 2) / s0, Y = view.cy + (py - H / 2) / s0;
  view.z = Math.max(1, Math.min(20, view.z + dz));
  if (cam.st.mode === "free") { const s1 = TILE * 2 ** view.z; view.cx = X - (px - W / 2) / s1; view.cy = Y - (py - H / 2) / s1; }
  draw();
}
cv.addEventListener("wheel", (e) => { e.preventDefault(); const b = cv.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 0.25 : -0.25, e.clientX - b.left, e.clientY - b.top); }, { passive: false });
$("zin").onclick = () => zoomAt(0.5, cv.clientWidth / 2, cv.clientHeight / 2);
$("zout").onclick = () => zoomAt(-0.5, cv.clientWidth / 2, cv.clientHeight / 2);
$("fit").onclick = () => { cam.free(); fit(); draw(); };
$("theme").onclick = () => { dark = !dark; draw(); };
slider.addEventListener("input", draw);
addEventListener("resize", draw);
// a replay page (the HTML report with one cursor) drives the time from outside: its timeline, plots and
// play move the markers here; its own time row is hidden there - one time control per page
addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.sv !== "replay") return;
  if (m.hideTime) { $("time").hidden = true; $("title").style.visibility = "hidden"; }   // the card has the title
  if (typeof m.dark === "boolean") dark = m.dark;
  if (typeof m.t === "number" && isFinite(m.t)) slider.value = Math.min(t1, Math.max(t0, m.t));
  draw();
});
fit(); draw();
window.__page = { trail: () => trail.sec, cam: () => cam.st, rel: () => rel.el ? { shown: rel.shown(), pair: rel.pair, value: rel.value } : null };   // for tests
</script>
</body>
</html>
