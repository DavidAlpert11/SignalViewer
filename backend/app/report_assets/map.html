<!doctype html>
<html lang="__LANG__" dir="__DIR__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!--__NOTE__-->
<style>
  :root { --bg: #ffffff; --ink: #1f2a36; --muted: #5a6979; --line: #d5dce4; --panel: #f7f9fb; --accent: #945d0b; color-scheme: light; }
  :root.dark { --bg: #151b23; --ink: #e6edf3; --muted: #8e9cad; --line: #2d3a4b; --panel: #1c2430; --accent: #f2a93b; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0; flex: 1; min-width: 8em; }
  button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  #wrap { position: relative; flex: 1; min-height: 240px; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.drag { cursor: grabbing; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-size: 12px; display: none; white-space: nowrap; }
  #time { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--panel); }
  #slider { flex: 1; accent-color: var(--accent); }
  #tval { min-width: 7em; text-align: end; font-variant-numeric: tabular-nums; }
  footer { padding: 3px 10px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  #legend { position: absolute; top: 8px; inset-inline-start: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  #legend div { display: flex; align-items: center; gap: 6px; }
  #legend i { width: 14px; height: 3px; display: inline-block; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="fit" title="Fit all tracks">⤢</button>
  <button id="theme" title="Light / dark">◐</button>
</header>
<div id="wrap"><canvas id="map"></canvas><div id="legend"></div><div id="tip" role="tooltip"></div></div>
<div id="time"><span>t</span><input id="slider" type="range" min="0" max="1" step="any" aria-label="Time"><span id="tval"></span></div>
<footer><span id="att"></span> · <span>__NOTE_TEXT__</span></footer>
<script>
"use strict";
const D = /*__DATA__*/null;
const LAT_MAX = 85.05112878, TILE = 256;
const mx = (lon) => (lon + 180) / 360;
const my = (lat) => { const s = Math.sin(Math.max(-LAT_MAX, Math.min(LAT_MAX, lat)) * Math.PI / 180); return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); };
const cv = document.getElementById("map"), ctx = cv.getContext("2d"), tip = document.getElementById("tip");
const slider = document.getElementById("slider"), tval = document.getElementById("tval");
document.getElementById("title").textContent = D.title || "Map";
document.getElementById("att").textContent = D.attribution;
let dark = D.dark || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
const imgs = { light: {}, dark: {} };
for (const th of ["light", "dark"]) for (const [k, src] of Object.entries(D.tiles[th])) { const im = new Image(); im.onload = draw; im.src = src; imgs[th][k] = im; }
// the tracks in Mercator units, once
const objs = D.objects.map((o) => ({ ...o, X: o.lon.map(mx), Y: o.lat.map(my) }));
const legend = document.getElementById("legend");
for (const o of objs) { const d = document.createElement("div"); const i = document.createElement("i"); i.style.background = o.color; d.append(i, document.createTextNode(o.name)); legend.append(d); }
let t0 = Infinity, t1 = -Infinity;
for (const o of objs) { if (o.t.length) { t0 = Math.min(t0, o.t[0]); t1 = Math.max(t1, o.t[o.t.length - 1]); } }
slider.min = t0; slider.max = t1; slider.value = D.cursor ?? t1;
// the view: centre (Mercator) and zoom (a float: 2^z tiles across the world)
const view = { cx: 0.5, cy: 0.5, z: 2 };
function fit() {
  const [s, w, n, e] = D.bounds, W = cv.clientWidth || 800, H = cv.clientHeight || 500;
  const x0 = mx(w), x1 = mx(e), y0 = my(n), y1 = my(s);
  view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;
  view.z = Math.log2(Math.min(W / Math.max(x1 - x0, 1e-9), H / Math.max(y1 - y0, 1e-9)) / TILE);
}
const toPx = (X, Y) => { const s = TILE * 2 ** view.z; return [cv.width / 2 + (X - view.cx) * s * devicePixelRatio, cv.height / 2 + (Y - view.cy) * s * devicePixelRatio]; };
const idxAt = (o, t) => { let lo = 0, hi = o.t.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (o.t[m] <= t) lo = m; else hi = m - 1; } return lo; };
function draw() {
  const W = cv.clientWidth, H = cv.clientHeight, r = devicePixelRatio || 1;
  if (cv.width !== Math.round(W * r) || cv.height !== Math.round(H * r)) { cv.width = Math.round(W * r); cv.height = Math.round(H * r); }
  const th = dark ? "dark" : "light";
  document.documentElement.classList.toggle("dark", dark);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--bg");
  ctx.fillRect(0, 0, cv.width, cv.height);
  // the embedded level nearest below the view's zoom (else the coarsest), its tiles scaled
  const lv = D.levels[th]; let L = lv[0];
  for (const z of lv) if (z <= Math.ceil(view.z)) L = z;
  if (L !== undefined) {
    const n = 2 ** L, s = TILE * 2 ** view.z * r / n;
    for (const [k, im] of Object.entries(imgs[th])) {
      const [z, x, y] = k.split("/").map(Number);
      if (z !== L || !im.complete) continue;
      const [px, py] = toPx(x / n, y / n);
      if (px > cv.width || py > cv.height || px + s < 0 || py + s < 0) continue;
      ctx.drawImage(im, px, py, s + 0.5, s + 0.5);
    }
  }
  const t = Number(slider.value);
  tval.textContent = t.toFixed(2) + " s";
  for (const o of objs) {
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    for (const [w, c] of [[4.5 * r, dark ? "rgba(0,0,0,.6)" : "rgba(255,255,255,.75)"], [2.2 * r, o.color]]) {
      ctx.beginPath(); ctx.lineWidth = w; ctx.strokeStyle = c;
      o.X.forEach((X, i) => { const [px, py] = toPx(X, o.Y[i]); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
      ctx.stroke();
    }
    const k = idxAt(o, t), [px, py] = toPx(o.X[k], o.Y[k]);
    ctx.beginPath(); ctx.arc(px, py, 6 * r, 0, 2 * Math.PI); ctx.fillStyle = o.color; ctx.fill();
    ctx.lineWidth = 2 * r; ctx.strokeStyle = dark ? "#151b23" : "#fff"; ctx.stroke();
    ctx.font = `${12 * r}px system-ui, sans-serif`; ctx.fillStyle = dark ? "#e6edf3" : "#1f2a36";
    ctx.fillText(o.name, px + 9 * r, py - 7 * r);
  }
  window.__markers = objs.map((o) => { const k = idxAt(o, t); return [o.lat[k], o.lon[k]]; });   // for tests
}
// pan, zoom, hover
let drag = null;
cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy }; cv.setPointerCapture(e.pointerId); cv.classList.add("drag"); });
cv.addEventListener("pointerup", () => { drag = null; cv.classList.remove("drag"); });
cv.addEventListener("pointermove", (e) => {
  const s = TILE * 2 ** view.z;
  if (drag) { view.cx = drag.cx - (e.clientX - drag.x) / s; view.cy = drag.cy - (e.clientY - drag.y) / s; draw(); return; }
  const b = cv.getBoundingClientRect(), r = devicePixelRatio || 1, mxp = (e.clientX - b.left) * r, myp = (e.clientY - b.top) * r;
  let best = null, dmin = 10 * r;
  for (const o of objs) o.X.forEach((X, i) => { const [px, py] = toPx(X, o.Y[i]); const d = Math.hypot(px - mxp, py - myp); if (d < dmin) { dmin = d; best = { o, i }; } });
  if (!best) { tip.style.display = "none"; return; }
  const { o, i } = best;
  tip.textContent = `${o.name} · t ${o.t[i].toFixed(2)} s · ${o.lat[i].toFixed(6)}, ${o.lon[i].toFixed(6)}` + (o.alt ? ` · ${o.alt[i].toFixed(1)} m` : "");
  tip.style.display = "block"; tip.style.left = (e.clientX - b.left + 12) + "px"; tip.style.top = (e.clientY - b.top + 12) + "px";
});
cv.addEventListener("pointerleave", () => { tip.style.display = "none"; });
function zoomAt(dz, px, py) {
  const s0 = TILE * 2 ** view.z, W = cv.clientWidth, H = cv.clientHeight;
  const X = view.cx + (px - W / 2) / s0, Y = view.cy + (py - H / 2) / s0;
  view.z = Math.max(1, Math.min(20, view.z + dz));
  const s1 = TILE * 2 ** view.z; view.cx = X - (px - W / 2) / s1; view.cy = Y - (py - H / 2) / s1; draw();
}
cv.addEventListener("wheel", (e) => { e.preventDefault(); const b = cv.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 0.25 : -0.25, e.clientX - b.left, e.clientY - b.top); }, { passive: false });
document.getElementById("zin").onclick = () => zoomAt(0.5, cv.clientWidth / 2, cv.clientHeight / 2);
document.getElementById("zout").onclick = () => zoomAt(-0.5, cv.clientWidth / 2, cv.clientHeight / 2);
document.getElementById("fit").onclick = () => { fit(); draw(); };
document.getElementById("theme").onclick = () => { dark = !dark; draw(); };
slider.addEventListener("input", draw);
addEventListener("resize", draw);
fit(); draw();
</script>
</body>
</html>
