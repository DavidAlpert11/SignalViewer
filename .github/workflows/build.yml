# Builds a portable package (.7z) for Windows, Linux and macOS and runs the tests.
#
#   Run manually:  Actions -> build -> Run workflow   (the files are in the run's Artifacts; the
#                  version in their names: the one typed there, else the one in build.bat)
#   Release:       push a tag such as v1.3.0          (also makes a draft Release with the three files)
#
#   Windows: the official embeddable Python + the libraries + the app (tools/make_windows_portable.py)
#   Linux / macOS: a PyInstaller folder (SignalViewer.spec) - nothing to install, no Python needed
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version in the file names (empty: the one in build.bat)"
        default: ""

permissions:
  contents: write          # only the release job uses it (to create the draft release)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows-x64 }
          - { os: ubuntu-22.04,   name: Linux-x64 }      # 22.04: runs on older Linux too (glibc 2.35)
          - { os: macos-latest,   name: macOS-arm64 }    # Apple silicon (M1 and later)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Package name
        run: |
          V="${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          V="${V#v}"
          # not given: the version a release writes into build.bat (one place to change it)
          [ -n "$V" ] || V="$(sed -n 's/^set VERSION=\([0-9.]*\).*/\1/p' build.bat | head -1)"
          [ -n "$V" ] || V=dev
          echo "PKG=SignalViewer-$V-${{ matrix.name }}-portable" >> "$GITHUB_ENV"

      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Backend tests
        run: python -m pytest backend/tests -q

      # ---------------------------------------------------------------- Windows
      - name: Windows portable (embeddable Python)
        if: runner.os == 'Windows'
        run: |
          python tools/make_windows_portable.py --out dist --keep-folder
          mv dist/SignalViewer-Windows-portable.7z "dist/$PKG.7z"
          echo "APP_CMD=build/winportable/SignalViewer/runtime/python.exe build/winportable/SignalViewer/app/run.py" >> "$GITHUB_ENV"

      # ---------------------------------------------------------- Linux / macOS
      - name: Linux / macOS build (PyInstaller folder)
        if: runner.os != 'Windows'
        run: |
          pip install pyinstaller
          pyinstaller SignalViewer.spec --noconfirm
          echo "APP_CMD=dist/SignalViewer/SignalViewer" >> "$GITHUB_ENV"

      - name: Smoke test (starts without network, answers, stops)
        run: |
          $APP_CMD --port 8899 --no-open &
          PID=$!
          ok=0
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8899/api/runs >/dev/null && { ok=1; break; }; sleep 1; done
          kill $PID 2>/dev/null || true
          [ $ok = 1 ] || { echo "The app did not start"; exit 1; }
          echo "The app started and answered."

      - name: Linux / macOS archive (.7z)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install sevenzip; else sudo apt-get update -q && sudo apt-get install -y -q p7zip-full; fi
          Z=$(command -v 7zz || command -v 7z)
          # -snl keeps the links inside the folder as links; Unix permissions (the executable bit) are kept
          (cd dist && "$Z" a -t7z -mx=9 -m0=lzma2 -mmt=on -snl -bso0 -bsp0 "$PKG.7z" SignalViewer)

      - name: Size
        run: ls -la "dist/$PKG.7z"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}.7z
          compression-level: 0          # already compressed
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Draft release with the three packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/*.7z --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" out/*.7z --draft --title "Signal Viewer ${GITHUB_REF_NAME#v}" \
              --generate-notes -R "$GITHUB_REPOSITORY"
          fi
