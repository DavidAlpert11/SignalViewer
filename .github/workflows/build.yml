# Builds the packages for Windows, Linux and macOS and runs the tests.
#
#   Run manually:  Actions -> build -> Run workflow   (the files are in the run's Artifacts; the
#                  version in their names: the one typed there, else the one in build.bat)
#   Release:       push a tag such as v1.3.0          (also makes a draft Release with every file)
#
#   Windows: the INSTALLER (SignalViewer-Setup-X.Y.Z.exe: PyInstaller folder + Inno Setup - what
#            most users want, T53), and the portable package (official embeddable Python + the
#            libraries + the app, tools/make_windows_portable.py) as .zip (opens anywhere) and .7z
#   Linux / macOS: a PyInstaller folder (SignalViewer.spec) - nothing to install, no Python needed
#   Python: `pip install signalviewer` (T56) - the wheel is built and checked on every run; on a
#           tag it is published to PyPI when the repository variable PYPI_PUBLISH is "true" and
#           PyPI trusts this workflow (pypi.org -> project -> Publishing -> GitHub, workflow build.yml,
#           environment pypi). No token is stored anywhere.
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version in the file names (empty: the one in build.bat)"
        default: ""

permissions:
  contents: write          # only the release job uses it (to create the draft release)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows-x64 }
          - { os: ubuntu-22.04,   name: Linux-x64 }      # 22.04: runs on older Linux too (glibc 2.35)
          - { os: macos-latest,   name: macOS-arm64 }    # Apple silicon (M1 and later)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Package name
        run: |
          V="${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          V="${V#v}"
          # not given: the version a release writes into build.bat (one place to change it)
          [ -n "$V" ] || V="$(sed -n 's/^set VERSION=\([0-9.]*\).*/\1/p' build.bat | head -1)"
          [ -n "$V" ] || V=dev
          echo "PKG=SignalViewer-$V-${{ matrix.name }}-portable" >> "$GITHUB_ENV"
          echo "VER=$V" >> "$GITHUB_ENV"

      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Backend tests
        run: python -m pytest backend/tests -q

      - name: Type check (mypy, T36)
        if: runner.os == 'Linux'            # the same on every OS: once is enough
        working-directory: backend
        run: mypy --config-file ../pyproject.toml app svcore signalviewer

      # ---------------------------------------------------------------- Windows
      - name: Windows portable (embeddable Python)
        if: runner.os == 'Windows'
        run: |
          python tools/make_windows_portable.py --out dist --keep-folder
          mv dist/SignalViewer-Windows-portable.7z "dist/$PKG.7z"
          echo "APP_CMD=build/winportable/SignalViewer/runtime/python.exe build/winportable/SignalViewer/app/run.py" >> "$GITHUB_ENV"

      - name: Windows portable as .zip (Windows 10 opens .7z only with 7-Zip)
        if: runner.os == 'Windows'
        run: (cd build/winportable && 7z a -tzip -mx=7 -bso0 -bsp0 "../../dist/$PKG.zip" SignalViewer)

      - name: Windows installer (PyInstaller folder + Inno Setup)
        if: runner.os == 'Windows'
        run: |
          pip install pyinstaller
          pyinstaller SignalViewer.spec --noconfirm
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || { choco install innosetup -y --no-progress >/dev/null; }
          [ -f "$ISCC" ] || { echo "Inno Setup was not found"; exit 1; }
          "$ISCC" //Q "//DAppVersion=$VER" installer/SignalViewer.iss
          ls -la "dist/SignalViewer-Setup-$VER.exe"

      - name: Installer smoke test (silent install for this user, starts, answers, stops)
        if: runner.os == 'Windows'
        run: |
          "dist/SignalViewer-Setup-$VER.exe" //VERYSILENT //SUPPRESSMSGBOXES //CURRENTUSER //NORESTART "//DIR=$RUNNER_TEMP\\svinst"
          "$RUNNER_TEMP/svinst/SignalViewer.exe" --port 8898 --no-open &
          ok=0
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8898/api/runs >/dev/null && { ok=1; break; }; sleep 1; done
          taskkill //F //IM SignalViewer.exe >/dev/null 2>&1 || true
          [ $ok = 1 ] || { echo "The installed app did not start"; exit 1; }
          echo "The installed app started and answered."

      # ---------------------------------------------------------- Linux / macOS
      - name: Linux / macOS build (PyInstaller folder)
        if: runner.os != 'Windows'
        run: |
          pip install pyinstaller
          pyinstaller SignalViewer.spec --noconfirm
          echo "APP_CMD=dist/SignalViewer/SignalViewer" >> "$GITHUB_ENV"

      - name: Smoke test (starts without network, answers, stops)
        run: |
          $APP_CMD --port 8899 --no-open &
          PID=$!
          ok=0
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8899/api/runs >/dev/null && { ok=1; break; }; sleep 1; done
          kill $PID 2>/dev/null || true
          [ $ok = 1 ] || { echo "The app did not start"; exit 1; }
          echo "The app started and answered."

      - name: Linux / macOS archive (.7z)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install sevenzip; else sudo apt-get update -q && sudo apt-get install -y -q p7zip-full; fi
          Z=$(command -v 7zz || command -v 7z)
          # -snl keeps the links inside the folder as links; Unix permissions (the executable bit) are kept
          (cd dist && "$Z" a -t7z -mx=9 -m0=lzma2 -mmt=on -snl -bso0 -bsp0 "$PKG.7z" SignalViewer)

      - name: Size
        run: ls -la dist/$PKG.* dist/SignalViewer-Setup-*.exe 2>/dev/null || ls -la "dist/$PKG.7z"

      - uses: actions/upload-artifact@v6        # v6: the first on Node 24 (v4 / v5: Node 20, deprecated)
        with:
          name: ${{ env.PKG }}
          path: |
            dist/${{ env.PKG }}.7z
            dist/${{ env.PKG }}.zip
            dist/SignalViewer-Setup-*.exe
          compression-level: 0          # already compressed
          if-no-files-found: error

  pypi-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Build UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build the package, install it in a fresh venv and start it
        run: |
          pip install build
          python tools/make_pypi.py --check
      - uses: actions/upload-artifact@v6
        with:
          name: signalviewer-python-package
          path: dist-pypi/*

  pypi-publish:
    if: github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true'
    needs: [build, pypi-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # PyPI trusted publishing: no token
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: signalviewer-python-package
          path: dist-pypi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi

  release:
    if: github.ref_type == 'tag'
    needs: [build, pypi-build]       # the Python wheel goes on the release page too
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7      # v7: the first on Node 24
        with:
          path: out
          merge-multiple: true
      - name: Draft release with every package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          V="${GITHUB_REF_NAME#v}"
          # which file to take - first thing on the release page (T53)
          cat > notes.md <<EOF
          **Which file?**
          - **Windows:** \`SignalViewer-Setup-$V.exe\` - installs for you only, no administrator rights, nothing else needed.
          - Windows without installing: \`SignalViewer-$V-Windows-x64-portable.zip\` - extract, double-click *Signal Viewer.bat* (the .7z is the same, smaller; Windows 10 needs 7-Zip for it).
          - **Python:** \`pip install signalviewer\` (or the \`.whl\` here), then \`signalviewer\` starts the app; \`signalviewer-cli\` and \`import signalviewer\` read files from scripts.
          - **Linux / macOS:** the \`-portable.7z\` for your system - extract and run \`SignalViewer/SignalViewer\` (macOS: see *Known limitations* in the docs, docs/limitations.md, the first time).

          Everything runs offline; no Python is needed. Changes: [CHANGELOG](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md).
          EOF
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" out/* --draft --title "Signal Viewer $V" \
              --notes-file notes.md --generate-notes -R "$GITHUB_REPOSITORY"
          fi
