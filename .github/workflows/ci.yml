# T64 (Q81): the checks of CLAUDE.md on every push and pull request - build.yml runs only on a tag
# or by hand, so a change that breaks something was found at the release, and a contributor's pull
# request got no answer at all. Fast on purpose (a few minutes): the packages and the whole e2e
# suite stay in build.yml and on the owner's PC.
#
#   backend   pytest on the oldest Python the package allows (3.9) and a current one; mypy once
#   frontend  tsc + vite build (frontend/dist is not committed from here: a release rebuilds it)
#   e2e       a short Playwright smoke run on the freshly built UI: a new user's first start, the
#             main workflows, the top bar and Help menu
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:                   # a new push to the same branch / pull request stops the old run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pypdf "mypy>=1.10"
      - name: Backend tests
        run: python -m pytest backend/tests -q
      - name: Type check (mypy, T36)
        if: matrix.python == '3.12'
        working-directory: backend
        run: mypy --config-file ../pyproject.toml app svcore signalviewer
      - name: Numerical validation (as a user would run it)
        if: matrix.python == '3.12'
        run: python cli.py validate

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  e2e:
    needs: frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7       # the UI of THIS commit, not the committed dist (v7: Node 24, as in build.yml)
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Python dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx "playwright>=1.40"
          python -m playwright install --with-deps chromium
      - name: End-to-end smoke run
        run: python -m pytest -q tests/e2e/test_fresh_user.py tests/e2e/test_workflows.py tests/e2e/test_file_help_menus.py
