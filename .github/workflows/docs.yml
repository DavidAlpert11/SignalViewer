# T43 / Q73: the documentation site on GitHub Pages, built from docs/ with MkDocs (mkdocs.yml).
# One-time setup by the owner (without it the deploy job fails with "404 ... Ensure GitHub Pages has been
# enabled"): https://github.com/DavidAlpert11/SignalViewer/settings/pages -> Build and deployment ->
# Source: GitHub Actions. Then Actions -> docs -> Run workflow (or push a change under docs/).
name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"    # B9: the Material theme (mkdocs.yml)
      - run: mkdocs build --strict -d site     # a broken link or a missing page fails the build
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
